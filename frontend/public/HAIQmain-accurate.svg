<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EAD8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D9C3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brownAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A67C52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B4423;stop-opacity:1" />
    </linearGradient>
    <filter id="textShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- H Letter -->
  <g filter="url(#textShadow)">
    <text x="40" y="240" font-family="Georgia, serif" font-size="160" font-weight="700"
          fill="url(#textGradient)" stroke="#D4C4A8" stroke-width="1">H</text>
  </g>

  <!-- A Letter -->
  <g filter="url(#textShadow)">
    <text x="180" y="240" font-family="Georgia, serif" font-size="160" font-weight="700"
          fill="url(#textGradient)" stroke="#D4C4A8" stroke-width="1">A</text>
  </g>

  <!-- I Letter -->
  <g filter="url(#textShadow)">
    <text x="320" y="240" font-family="Georgia, serif" font-size="160" font-weight="700"
          fill="url(#textGradient)" stroke="#D4C4A8" stroke-width="1">I</text>
  </g>

  <!-- Q Letter -->
  <g filter="url(#textShadow)">
    <text x="390" y="240" font-family="Georgia, serif" font-size="160" font-weight="700"
          fill="url(#textGradient)" stroke="#D4C4A8" stroke-width="1">Q</text>
  </g>

  <!-- Brown colon : -->
  <g filter="url(#textShadow)">
    <!-- Top dot -->
    <circle cx="460" cy="130" r="16" fill="url(#brownAccent)" stroke="#6B4423" stroke-width="0.5"/>
    <!-- Bottom dot -->
    <circle cx="460" cy="320" r="16" fill="url(#brownAccent)" stroke="#6B4423" stroke-width="0.5"/>
  </g>

  <!-- Smile/mouth in brown -->
  <g filter="url(#textShadow)">
    <path d="M 380 380 Q 256 420 132 380"
          fill="none" stroke="url(#brownAccent)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>