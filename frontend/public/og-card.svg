<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A0A00"/>
      <stop offset="100%" stop-color="#0E0600"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A67C52" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A67C52" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <ellipse cx="600" cy="260" rx="480" ry="280" fill="url(#glow)"/>

  <!-- Top rule -->
  <line x1="80" y1="48" x2="1120" y2="48" stroke="#A67C52" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Bottom rule -->
  <line x1="80" y1="582" x2="1120" y2="582" stroke="#A67C52" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Left rule -->
  <line x1="80" y1="48" x2="80" y2="582" stroke="#A67C52" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Right rule -->
  <line x1="1120" y1="48" x2="1120" y2="582" stroke="#A67C52" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Crown mark (simplified) -->
  <g transform="translate(576, 148)">
    <path d="M0,28 L-24,0 L-12,12 L0,-8 L12,12 L24,0 Z" fill="none" stroke="#A67C52" stroke-width="2" stroke-linejoin="round"/>
    <line x1="-26" y1="28" x2="26" y2="28" stroke="#A67C52" stroke-width="2"/>
  </g>

  <!-- Main headline -->
  <text x="600" y="248" font-family="Georgia, serif" font-size="82" font-weight="700" fill="#F5EAD8" text-anchor="middle" letter-spacing="-1">Made For You.</text>

  <!-- Divider line -->
  <line x1="540" y1="278" x2="660" y2="278" stroke="#A67C52" stroke-width="2"/>

  <!-- Sub-headline -->
  <text x="600" y="328" font-family="Georgia, serif" font-size="26" fill="#A67C52" text-anchor="middle" letter-spacing="6" font-weight="400">HAIQ BAKERY</text>

  <!-- Body copy -->
  <text x="600" y="378" font-family="Arial, sans-serif" font-size="20" fill="#F5EAD8" fill-opacity="0.45" text-anchor="middle" letter-spacing="1">Handcrafted cookies · Baked fresh every morning · Kampala, Uganda</text>

  <!-- Bottom label -->
  <text x="600" y="556" font-family="Arial, sans-serif" font-size="14" fill="#A67C52" fill-opacity="0.5" text-anchor="middle" letter-spacing="4" font-weight="700">FROM UGX 5,000 · ORDER ONLINE</text>
</svg>
