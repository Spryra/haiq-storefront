<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="beige3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5EAD8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#E8D9C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4C4A8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brown3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C17F4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5A2B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- H -->
  <g filter="url(#shadow)">
    <path d="M 50 80 L 50 420 Q 50 440 70 440 L 110 440 Q 130 440 130 420 L 130 280 L 250 280 L 250 420 Q 250 440 270 440 L 310 440 Q 330 440 330 420 L 330 80 Q 330 60 310 60 L 270 60 Q 250 60 250 80 L 250 200 L 130 200 L 130 80 Q 130 60 110 60 L 70 60 Q 50 60 50 80 Z" fill="url(#beige3d)" stroke="#C8B8A4" stroke-width="2"/>
    <!-- 3D effect -->
    <path d="M 52 82 L 52 420 Q 52 438 70 438 L 110 438 Q 128 438 128 420 L 128 282 L 248 282 L 248 420 Q 248 438 270 438 L 310 438 Q 328 438 328 420 L 328 82 Q 328 62 310 62 L 270 62 Q 252 62 252 82 L 252 200 L 132 200 L 132 82 Q 132 62 110 62 L 70 62 Q 52 62 52 82 Z" fill="none" stroke="#A89878" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- A -->
  <g filter="url(#shadow)">
    <path d="M 350 80 Q 340 60 320 60 L 280 60 Q 260 60 250 80 L 150 440 Q 145 460 165 460 L 205 460 Q 225 460 230 440 L 260 340 L 420 340 L 450 440 Q 455 460 475 460 L 515 460 Q 535 460 530 440 Z M 270 280 L 340 140 L 410 280 Z" fill="url(#beige3d)" stroke="#C8B8A4" stroke-width="2"/>
    <!-- 3D effect -->
    <path d="M 352 82 Q 342 62 322 62 L 282 62 Q 262 62 252 82 L 152 442 Q 147 458 167 458 L 207 458 Q 227 458 232 442 L 262 342 L 422 342 L 452 442 Q 457 458 477 458 L 517 458 Q 537 458 532 442 Z M 272 282 L 342 142 L 412 282 Z" fill="none" stroke="#A89878" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Colon : in brown -->
  <g filter="url(#shadow)">
    <!-- Top dot -->
    <circle cx="460" cy="160" r="25" fill="url(#brown3d)" stroke="#6B4423" stroke-width="1.5"/>
    <!-- Bottom dot -->
    <circle cx="460" cy="360" r="25" fill="url(#brown3d)" stroke="#6B4423" stroke-width="1.5"/>
    <!-- 3D highlights -->
    <circle cx="460" cy="160" r="23" fill="none" stroke="#D4956B" stroke-width="1" opacity="0.6"/>
    <circle cx="460" cy="360" r="23" fill="none" stroke="#D4956B" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Q -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="320" r="160" fill="url(#beige3d)" stroke="#C8B8A4" stroke-width="2"/>
    <circle cx="256" cy="320" r="100" fill="none" stroke="white" stroke-width="20"/>
    <!-- Q tail -->
    <path d="M 350 400 Q 380 420 420 460" fill="none" stroke="url(#beige3d)" stroke-width="30" stroke-linecap="round"/>
    <!-- 3D effect -->
    <circle cx="256" cy="320" r="158" fill="none" stroke="#A89878" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Smiley mouth in brown -->
  <g filter="url(#shadow)">
    <path d="M 200 420 Q 256 480 312 420" fill="none" stroke="url(#brown3d)" stroke-width="25" stroke-linecap="round"/>
    <!-- Smile 3D effect -->
    <path d="M 200 422 Q 256 480 312 422" fill="none" stroke="#D4956B" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
