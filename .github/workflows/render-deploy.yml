name: Trigger Render Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        run: |
          RENDER_DEPLOY_HOOK="${{ secrets.RENDER_DEPLOY_HOOK }}"
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "WARNING: RENDER_DEPLOY_HOOK secret not set. Deployment will not be triggered."
            echo "Please set the RENDER_DEPLOY_HOOK secret in GitHub repository settings."
            exit 0
          fi
          curl --request POST \
            --url "$RENDER_DEPLOY_HOOK" \
            --header 'content-type: application/json' \
            --data '{"branch":"main"}'
          echo "Deployment triggered successfully"
